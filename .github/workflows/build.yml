name: build
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + ldid + dpkg
        run: |
          brew install ldid dpkg
          sudo mkdir -p /opt
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          # SDK 15.6
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C /tmp
          sudo mkdir -p /opt/theos/sdks
          sudo cp -r /tmp/sdks-master/iPhoneOS15.6.sdk /opt/theos/sdks/ 2>/dev/null || \
          sudo cp -r /tmp/sdks-master/*.sdk /opt/theos/sdks/ 2>/dev/null || true
          echo "SDKs:"; ls /opt/theos/sdks/ | grep iPhone || true
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Inject roothide substrate tbd
        run: |
          sudo mkdir -p /opt/theos/vendor/lib/iphone/roothide
          sudo cp libsubstrate-roothide.tbd /opt/theos/vendor/lib/iphone/roothide/libsubstrate.tbd
          echo "injected roothide libsubstrate.tbd"

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build (roothide)
        run: |
          chmod +x build.sh
          ./build.sh roothide release

      - name: Collect
        run: |
          mkdir -p output
          find . -name "*.deb" -path "*packages*" -exec cp {} output/ \;
          ls -la output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: squidtopulloverx-roothide-deb
          path: output/*.deb
          if-no-files-found: error